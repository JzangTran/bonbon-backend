bonbon:
  order:
    timers:
      # Tests call OrderTimers.runOnce themselves, with a time they choose.
      enabled: false
  payment:
    reconcile:
      # Tests call PaymentReconciliation.runOnce and PaymentRefunds themselves.
      enabled: false
    refund:
      immediate: false
  account:
    deletions:
      # Tests call AccountDeletionService.executeDue with a time they choose.
      enabled: false
  merchantapproval:
    closures:
      # Tests call ShopClosureService.finishReady themselves.
      enabled: false
  legal:
    reminders:
      # Tests call LegalAdminService.remindDue with a time they choose.
      enabled: false
  support:
    tickets:
      # Tests call SupportTicketService.closeStale with a time they choose.
      enabled: false
  category:
    moderation:
      # Tests call DishCategoryModerationService.runDue with a time they choose.
      enabled: false
  geo:
    fake-when-unconfigured: true
  captcha:
    enabled: false
  security:
    jwt:
      secret: test-only-secret-at-least-32-bytes-long!!
    data-key: dGVzdC1vbmx5LWRhdGEta2V5LTMyLWJ5dGVzLWxvbmc=
spring:
  flyway:
    # db/testdata adds the service area every test shop is placed in.
    locations: classpath:db/migration,classpath:db/testdata
springdoc:
  api-docs:
    enabled: true

spring:
  application:
    name: bonbon-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${BONBON_DB_URL:jdbc:postgresql://localhost:5432/bonbon}
    username: ${BONBON_DB_USER:bonbon}
    password: ${BONBON_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  servlet:
    multipart:
      # Uploads are validated per use (type sniffed, size per field); this is only the outer bound.
      max-file-size: 10MB
      max-request-size: 25MB
  data:
    redis:
      host: ${BONBON_REDIS_HOST:localhost}
      port: ${BONBON_REDIS_PORT:6379}

springdoc:
  # Error responses come from @ApiError (OpenApiConfig), not from every @ExceptionHandler.
  override-with-generic-response: false
  default-produces-media-type: application/json
  api-docs:
    enabled: false

server:
  error:
    include-stacktrace: never

bonbon:
  security:
    jwt:
      # HS256 secret, at least 32 bytes. Set the environment variable; never commit a value.
      secret: ${BONBON_JWT_SECRET:}
    # AES-256 key (32 bytes, base64) for encrypted columns: identity numbers, bank accounts. Never commit.
    data-key: ${BONBON_DATA_KEY:}
  cors:
    allowed-origins: ${BONBON_CORS_ORIGINS:http://localhost:5173}
  app:
    # Links in emails (verify email, reset password) open the web app, which calls the API.
    web-url: ${BONBON_WEB_URL:http://localhost:5173}
  mail:
    from: ${BONBON_MAIL_FROM:bonbon <no-reply@bonbon.local>}
  admin:
    seed:
      # First administrator, created once at startup if none exists (admin-login.md).
      email: ${ADMIN_SEED_EMAIL:}
      password: ${ADMIN_SEED_PASSWORD:}
  storage:
    # S3 API: Cloudflare R2 in production (see deploy/.env.example). No defaults for credentials.
    endpoint: ${BONBON_STORAGE_ENDPOINT:}
    region: ${BONBON_STORAGE_REGION:auto}
    access-key: ${BONBON_STORAGE_ACCESS_KEY:}
    secret-key: ${BONBON_STORAGE_SECRET_KEY:}
    private-bucket: ${BONBON_STORAGE_PRIVATE_BUCKET:bonbon-private}
    public-bucket: ${BONBON_STORAGE_PUBLIC_BUCKET:bonbon-public}
    public-base-url: ${BONBON_STORAGE_PUBLIC_BASE_URL:}
  geo:
    goong:
      # Goong REST API key; stays on the server (clients call /api/geo/autocomplete).
      api-key: ${GOONG_API_KEY:}
  oauth:
    google:
      # OAuth client IDs (comma-separated) whose Google ID tokens are accepted: web, Android, iOS.
      # Not secret, but configured per environment; empty disables Google sign-in.
      client-ids: ${GOOGLE_CLIENT_IDS:}
  payment:
    # fake (default) never leaves the machine; momo talks to MoMo. Production must use momo.
    provider: ${BONBON_PAYMENT_PROVIDER:fake}
    momo:
      # MoMo test environment by default; production is https://payment.momo.vn after MoMo verifies the business.
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      # Where the customer lands after paying (shown only, never trusted) and where MoMo reports the result.
      redirect-url: ${MOMO_REDIRECT_URL:${bonbon.app.web-url}/payment/return}
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}
  captcha:
    enabled: ${BONBON_CAPTCHA_ENABLED:true}
    secret: ${BONBON_RECAPTCHA_SECRET:}

management:
  health:
    mail:
      # An SMTP outage must not mark the whole app unhealthy; emails are retried by the user (resend).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

spring:
  application:
    name: bonbon-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${BONBON_DB_URL:jdbc:postgresql://localhost:5432/bonbon}
    username: ${BONBON_DB_USER:bonbon}
    password: ${BONBON_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  data:
    redis:
      host: ${BONBON_REDIS_HOST:localhost}
      port: ${BONBON_REDIS_PORT:6379}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-stacktrace: never

bonbon:
  security:
    jwt:
      # HS256 secret, at least 32 bytes. Set the environment variable; never commit a value.
      secret: ${BONBON_JWT_SECRET:}
  cors:
    allowed-origins: ${BONBON_CORS_ORIGINS:http://localhost:5173}
  app:
    # Links in emails (verify email, reset password) open the web app, which calls the API.
    web-url: ${BONBON_WEB_URL:http://localhost:5173}
  mail:
    from: ${BONBON_MAIL_FROM:bonbon <no-reply@bonbon.local>}
  admin:
    seed:
      # First administrator, created once at startup if none exists (admin-login.md).
      email: ${ADMIN_SEED_EMAIL:}
      password: ${ADMIN_SEED_PASSWORD:}
  captcha:
    enabled: ${BONBON_CAPTCHA_ENABLED:true}
    secret: ${BONBON_RECAPTCHA_SECRET:}

management:
  health:
    mail:
      # An SMTP outage must not mark the whole app unhealthy; emails are retried by the user (resend).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

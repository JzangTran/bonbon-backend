spring:
  application:
    name: bonbon-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${BONBON_DB_URL:jdbc:postgresql://localhost:5432/bonbon}
    username: ${BONBON_DB_USER:bonbon}
    password: ${BONBON_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${BONBON_REDIS_HOST:localhost}
      port: ${BONBON_REDIS_PORT:6379}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-stacktrace: never

bonbon:
  security:
    jwt:
      # HS256 secret, at least 32 bytes. Set the environment variable; never commit a value.
      secret: ${BONBON_JWT_SECRET:}
  cors:
    allowed-origins: ${BONBON_CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

# Production: every value comes from the environment; nothing here may default to a secret.
spring:
  datasource:
    url: ${BONBON_DB_URL}
    username: ${BONBON_DB_USER}
    password: ${BONBON_DB_PASSWORD}

bonbon:
  payment:
    # The fake provider is refused in production (PaymentConfig); MoMo credentials come from MOMO_* variables.
    provider: ${BONBON_PAYMENT_PROVIDER:momo}

springdoc:
  api-docs:
    enabled: false

server:
  # Behind Caddy on the compose network (the backend port is never published): trust its X-Forwarded-For/-Proto so
  # client IPs (rate limits, consent records) and https links are the real ones.
  forward-headers-strategy: native
  # Finish in-flight requests on `docker compose stop` / redeploy.
  shutdown: graceful
